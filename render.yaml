services:
  # Backend API & ShareDB WebSocket Server
  - type: web
    name: cocolabs-backend
    env: node
    plan: free
    rootDir: editor-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cocolabs-db
          property: connectionString

databases:
  # Render Managed PostgreSQL Database
  - name: cocolabs-db
    plan: free
    databaseName: cocolabs
    user: cocolabs_user
